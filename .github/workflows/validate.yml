name: Validate valuation pipeline

on:
  push:
    paths:
      - "src/**"
      - "examples/synthetic_demo.py"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic example
        run: python examples/synthetic_demo.py

      - name: Commit refreshed figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/output/*.svg
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Refresh reproducible valuation figures"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
